<!DOCTYPE html>
<html>
	<head>
		<title>page title</title>
		<style>
			#wrapper{
				width: 100%;
				height: 800px;
				background-color: #a29bfe;
				margin: 0px auto;
			}
			#header{
				width: 100%;
				height: 100px;
				float: left;
				position: relative;
				background-color: #34495e;
			}
			#content{
				width: 100%;
				height: 600px;
				float: left;
				position: relative;
				background-color: #3498db;
			}
			
			/* about style start */
			#content .about{
				width: 50%;
				height: 600px;
				background-color: #16a085;
				float: left;
				position: relative;
			
			}
			.about .about-top{
				width: 100%;
				height: 300px;
				background-color: #3498db;
			}
			.about .about-bottom{
				width: 100%;
				height: 300px;
				background-color: #e74c3c;
			}
			.about-bottom-one{
				width: 33.33%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #badc58;
			}
			.about-bottom-two{
				width: 33.33%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #ff7979;
			}
			.about-bottom-three{
				width: 33.33%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #ffbe76;
			}
			/* about style end */
			
			#content .service{
				width: 50%;
				height: 600px;
				background-color: #e67e22;
				float: left;
				position: relative;	
			}
			#footer{
				width: 100%;
				height: 100px;
				float: left;
				position: relative;
				background-color: #8e44ad;
			}
		</style>
	</head>
	<body>
		<div id="wrapper">
			<div id="header"></div>
			<!-- content area start-->
			<div id="content">
				<!-- about start-->
				<div class="about">
					<div class="about-top"></div>
					<div class="about-bottom">
						<div class="about-bottom-one"></div>
						<div class="about-bottom-two"></div>
						<div class="about-bottom-three"></div>
					</div>
				</div>
				<!-- about end-->
				<div class="service"></div>
			</div>
			<!-- content area end-->
			<div id="footer"></div>
		</div>
	</body>
</html>
