<!DOCTYPE html>
<html>
	<head>
		<title>Assignment-5 Using Dive</title>
		
		<style>
			#main-container{
				width: 100%;
				height: 800px;
				background-color: #2ed573;
			}
			.header{
				width: 100%;
				height: 100px;
				float: left;
				position: relative;
				background-color: #3742fa;
			}
			.content-container{
				width: 100%;
				height: 600px;
				float: left;
				position: relative;
				background-color: #eccc68;
			}
			
			.content-container .about{
				width: 50%;
				height: 600px;
				float: left;
				position: relative;
				background-color: #2f3542;
			}
			.about .about-top{
				width: 100%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #18dcff;
			}
			.about .about-bottom{
				width: 100%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #fffa65;
				
			}
			.about-bottom .about-one{
				width: 33.3%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #ff4d4d;
				
				
			}
			.about-bottom .about-two{
				width: 33.3%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #cd84f1;
			}
			.about-bottom .about-three{
				width: 33.3%;
				height: 300px;
				float: left;
				position: relative;
				background-color: #2C3A47;
			}
			.footer{
				width: 100%;
				height: 100px;
				float: left;
				position: relative;
				background-color: #0c2461;
			}
			
		
		
		</style>
	</head>
	
	<body>
		<div id="main-container">
			<div class="header"></div>
			<div class="content-container">
				<div class="about">
					<div class="about-top"></div>
					<div class="about-bottom">
						<div class="about-one"></div>
						<div class="about-two"></div>
						<div class="about-three"></div>
					</div>
				</div>
				
			</div>
			<div class="footer"></div>
		</div>
	</body>
</html>
